<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uxixs</title>
  <meta name="description" content="Works archive">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <nav class="filters" id="filters" aria-label="종류별 보기"></nav>
    </header>

    <main id="works" class="works"></main>

    <footer class="foot" id="foot"></footer>
  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="PDF 보기" hidden>
    <div class="v-panel">
      <header class="v-bar">
        <div class="v-head">
          <p class="v-title"></p>
          <span class="v-info"></span>
        </div>
        <div class="v-tabs" role="group" aria-label="언어" hidden></div>
        <div class="v-tools">
          <a class="v-btn v-full" href="#" hidden></a>
          <a class="v-btn v-download" href="#" download></a>
          <a class="v-btn v-external icon" href="#" target="_blank" rel="noopener" aria-label="새 탭에서 열기" title="새 탭에서 열기"></a>
          <button type="button" class="v-btn v-close icon" aria-label="닫기" title="닫기 (Esc)"></button>
        </div>
      </header>
      <div class="v-pages"></div>
    </div>
  </div>

  <script src="data.js?v=9"></script>
  <script src="viewer.js?v=9"></script>
  <script src="tex.js?v=9"></script>
  <script src="main.js?v=9"></script>
</body>
</html>
